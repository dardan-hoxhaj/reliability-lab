apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability
  namespace: reliability-lab
  labels:
    app: reliability
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reliability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: reliability
    spec:
      containers:
        - name: reliability
          image: reliability-lab:local
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: reliability-config
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
