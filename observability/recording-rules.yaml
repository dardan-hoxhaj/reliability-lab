groups:
  - name: reliability-recording
    interval: 30s
    rules:
      - record: reliability:checks_success_ratio:rate5m
        expr: |
          sum(rate(reliability_checks_total{result="success"}[5m]))
          /
          sum(rate(reliability_checks_total[5m]))
      - record: reliability:http_latency_p95:rate5m
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(reliability_http_request_latency_seconds_bucket[5m])))
      # Error-budget burn rate over the last 5 minutes.
      # 1 = failing at exactly the SLO rate (budget lasts the full 30 days).
      # 14.4 = the fast-burn page threshold. 0 = no failures in the window.
      # This is a short-window rate, not the budget remaining over 30 days.
      - record: reliability:error_budget_burn_rate:ratio_rate5m
        expr: |
          (1 - reliability:checks_success_ratio:rate5m)
          / (1 - 0.995)
